name: Release browser extensions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag and package versions
        run: >-
          bun -e 'const packageVersion = (await Bun.file("package.json").json()).version;
          const expectedTag = `v${packageVersion}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            console.error(`Release tag ${process.env.GITHUB_REF_NAME} does not match ${expectedTag}`);
            process.exit(1);
          }'

      - name: Check and test
        run: bun run check

      - name: Build release archives
        run: bun run package

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
              --verify-tag \
              --generate-notes \
              --title "YT Zero Enhance ${GITHUB_REF_NAME#v}"
          fi
