name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish browser packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Check and package all targets
        run: |
          bun run check
          bun run package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag artifacts/*.zip
