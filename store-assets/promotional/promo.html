<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #07090e; color: #fff; }
    body::before { content: ""; position: absolute; inset: 0; background: url("/store-assets/promotional/background.png") center/cover no-repeat; opacity: .86; }
    body::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 52% 48%, transparent 0 28%, rgba(3,5,10,.18) 64%, rgba(3,5,10,.42)); }
    .layout { position: relative; z-index: 1; display: grid; grid-template-columns: 385px 1fr; align-items: center; gap: 40px; width: 100%; height: 100%; padding: 54px 50px 54px 62px; }
    .copy { align-self: center; }
    .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 30px; color: rgba(255,255,255,.78); font-size: 15px; font-weight: 700; letter-spacing: .025em; }
    .brand img { width: 46px; height: 46px; border-radius: 11px; box-shadow: 0 12px 28px rgba(10,95,255,.32); }
    .eyebrow { margin-bottom: 14px; color: #63b8ff; font-size: 13px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { max-width: 390px; margin: 0 0 20px; font-size: 55px; line-height: .99; letter-spacing: -.052em; text-wrap: balance; }
    .lead { max-width: 355px; margin: 0; color: rgba(255,255,255,.70); font-size: 18px; line-height: 1.5; text-wrap: balance; }
    .features { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 30px; }
    .features span { padding: 9px 12px; border: 1px solid rgba(99,184,255,.22); border-radius: 999px; background: rgba(12,26,52,.48); color: rgba(220,239,255,.86); font-size: 12px; font-weight: 650; backdrop-filter: blur(8px); }
    .window { align-self: center; justify-self: end; width: 752px; height: 630px; overflow: hidden; border: 1px solid rgba(255,255,255,.14); border-radius: 20px; background: #0f0f0f; box-shadow: 0 34px 90px rgba(0,0,0,.58), 0 0 0 1px rgba(10,95,255,.08); transform: perspective(1500px) rotateY(-2deg) rotateX(.5deg); transform-origin: right center; }
    .window-bar { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 15px; border-bottom: 1px solid rgba(255,255,255,.08); background: #191a1d; }
    .window-bar i { width: 9px; height: 9px; border-radius: 50%; background: #45474d; }
    .window-bar strong { margin-left: 9px; color: rgba(255,255,255,.43); font-size: 11px; font-weight: 600; }
    .viewport { width: 1100px; height: 870px; transform: scale(.68); transform-origin: top left; }
    iframe { display: block; width: 1100px; height: 870px; border: 0; background: #0f0f0f; }
    .locale-de h1 { font-size: 52px; }
    .locale-de .lead { font-size: 17px; }
  </style>
</head>
<body>
  <div class="layout">
    <section class="copy">
      <div class="brand"><img src="/static/icons/icon-128.png" alt=""><span>YT Zero Enhance</span></div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="headline"></h1>
      <p class="lead" id="lead"></p>
      <div class="features" id="features"></div>
    </section>
    <section class="window">
      <div class="window-bar"><i></i><i></i><i></i><strong id="window-title"></strong></div>
      <div class="viewport"><iframe id="preview" title="YT Zero Enhance"></iframe></div>
    </section>
  </div>
  <script>
    const copy = {
      en: { eyebrow: "Browser extension", headline: "Your YT Zero, upgraded.", lead: "Smoother playback, synchronized settings, and controls that feel right at home.", features: ["Multiple instances", "Profile sync", "Better controls"], title: "Instances and settings" },
      pl: { eyebrow: "Rozszerzenie przeglądarki", headline: "Twoje YT Zero. Jeszcze lepsze.", lead: "Wygodniejsze odtwarzanie, zsynchronizowane ustawienia i kontrolki, które pasują idealnie.", features: ["Wiele instancji", "Synchronizacja profilu", "Lepsze kontrolki"], title: "Instancje i ustawienia" },
      de: { eyebrow: "Browser-Erweiterung", headline: "Dein YT Zero. Noch besser.", lead: "Flüssigere Wiedergabe, synchronisierte Einstellungen und eine vertraute Steuerung.", features: ["Mehrere Instanzen", "Profilsynchronisierung", "Bessere Steuerung"], title: "Instanzen und Einstellungen" },
    };
    const locale = new URL(location.href).searchParams.get("locale") || "en";
    const text = copy[locale] || copy.en;
    document.documentElement.lang = locale;
    document.body.classList.add(`locale-${locale}`);
    document.querySelector("#eyebrow").textContent = text.eyebrow;
    document.querySelector("#headline").textContent = text.headline;
    document.querySelector("#lead").textContent = text.lead;
    document.querySelector("#window-title").textContent = text.title;
    document.querySelector("#features").replaceChildren(...text.features.map((label) => Object.assign(document.createElement("span"), { textContent: label })));
    document.querySelector("#preview").src = `/store-assets/promotional/options-preview.html?locale=${locale}`;
  </script>
</body>
</html>
