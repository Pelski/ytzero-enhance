<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YT Zero Enhance — player preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    body{background:radial-gradient(circle at 72% 28%,#d4a42d 0 12%,transparent 13%),linear-gradient(145deg,#345829,#9a7b38 45%,#493b28 70%,#111);background-size:cover}
    body:after{content:"Podgląd filmu";position:fixed;left:32px;top:25px;color:#fff;font-size:18px;font-weight:600;text-shadow:0 2px 5px #0008}
  </style>
</head>
<body>
<div id="ytze-player-controls" class="visible"></div>
<script type="module">
  const source=await fetch('/src/content.ts').then(response=>response.text());
  const styles=source.match(/const CONTROL_STYLES = `([\s\S]*?)`;\s*$/)?.[1]||'';
  const icon=(path)=>`<svg viewBox="0 0 24 24">${path}</svg>`;
  const play=icon('<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>');
  const volume=icon('<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/>');
  const captions=icon('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 10.5a2.5 2.5 0 1 0 0 3M17 10.5a2.5 2.5 0 1 0 0 3"/>');
  const camera=icon('<path d="M14.5 4 16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-3z"/><circle cx="12" cy="13" r="3"/>');
  const pip=icon('<rect x="2" y="3" width="20" height="14" rx="2"/><rect x="12" y="10" width="8" height="5" rx="1"/>');
  const full=icon('<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>');
  const root=document.querySelector('#ytze-player-controls').attachShadow({mode:'open'});
  root.innerHTML=`<style>${styles}</style><div class="controls"><div class="progress"><div class="progress-track"><div class="buffered" style="width:62%"></div><div class="markers"><i class="sponsor-marker" style="left:24%;width:8%;background:#00d400"></i><i class="chapter-marker" style="left:42%"></i><i class="sponsor-marker" style="left:72%;width:5%;background:#00ffff"></i></div><div class="played" style="width:38%"></div></div><div class="knob" style="left:38%;transform:translate(-50%,-50%) scale(1)"></div></div><div class="buttons"><button>${play}</button><div class="volume-wrap"><button>${volume}</button><input class="volume" type="range" value="0.8"></div><span class="time">14:48 / 38:59</span><span class="spacer"></span><button class="active">${captions}</button><button>${camera}</button><button>${pip}</button><button>${full}</button></div></div>`;
</script>
</body>
</html>
